<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - StreamBridge</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
        body.login-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 20px;
        }
        .login-card {
            background: #fff;
            border-radius: 16px;
            padding: 48px 40px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 24px 48px rgba(0,0,0,0.15);
        }
        .login-header { text-align: center; margin-bottom: 36px; }
        .login-logo {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 72px; height: 72px;
            font-size: 36px;
            background: linear-gradient(135deg, #6c5ce7, #0984e3);
            border-radius: 20px;
            margin-bottom: 16px;
            box-shadow: 0 8px 24px rgba(108,92,231,0.3);
        }
        .login-header h1 {
            font-size: 26px;
            font-weight: 700;
            margin: 0 0 6px;
            color: #1a202c;
        }
        .login-header p { color: #64748b; font-size: 13px; margin: 0; }
        .login-form .form-group { margin-bottom: 20px; }
        .login-form label {
            display: block;
            margin-bottom: 8px;
            color: #4a5568;
            font-size: 13px;
            font-weight: 500;
        }
        .login-form input {
            width: 100%;
            padding: 12px 16px;
            background: #f7f8fa;
            border: 1px solid #e2e8f0;
            border-radius: 10px;
            color: #1a202c;
            font-size: 14px;
            transition: all 0.2s;
            box-sizing: border-box;
        }
        .login-form input:focus {
            outline: none;
            border-color: #6c5ce7;
            background: #fff;
            box-shadow: 0 0 0 3px rgba(108,92,231,0.1);
        }
        .login-form input::placeholder { color: #a0aec0; }
        .login-form button {
            width: 100%;
            padding: 13px;
            margin-top: 8px;
            background: linear-gradient(135deg, #6c5ce7, #5a4bd1);
            border: none;
            border-radius: 10px;
            color: white;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }
        .login-form button:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 20px rgba(108,92,231,0.3);
        }
        .login-form button:active { transform: translateY(0); }
        .login-footer {
            text-align: center;
            margin-top: 24px;
            color: #a0aec0;
            font-size: 12px;
        }
        @media (max-width: 480px) {
            .login-card { padding: 32px 24px; }
        }
    </style>
</head>
<body class="login-page">
    <div class="login-card">
        <div class="login-header">
            <div class="login-logo">🎥</div>
            <h1>StreamBridge</h1>
            <p>直播转推YouTube管理平台</p>
        </div>
        <form method="POST" class="login-form">
            <div class="form-group">
                <label>用户名</label>
                <input type="text" name="username" required autofocus placeholder="请输入用户名">
            </div>
            <div class="form-group">
                <label>密码</label>
                <input type="password" name="password" required placeholder="请输入密码">
            </div>
            <button type="submit">登 录</button>
        </form>
        {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
        {% for category, message in messages %}
        <div class="flash flash-{{ category }}" style="margin-top:16px;">{{ message }}</div>
        {% endfor %}
        {% endif %}
        {% endwith %}
        <div class="login-footer">
            <a href="https://github.com/yyzq-cf/stream-bridge" target="_blank" style="display:inline-flex;align-items:center;gap:6px;color:#6c5ce7;text-decoration:none;">
                <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/></svg>
                StreamBridge v1.0
            </a>
            · Powered by FFmpeg + yt-dlp
        </div>
    </div>
</body>
</html>
