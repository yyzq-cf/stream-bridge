services:
  streambridge:
    image: ywsj/stream-bridge:latest
    container_name: streambridge
    restart: always
    ports:
      - "5300:5300"
    volumes:
      - ./data:/app/data
    environment:
      - ADMIN_USER=admin
      - ADMIN_PASS=admin123
      - SECRET_KEY=***      - MONITOR_INTERVAL=60
