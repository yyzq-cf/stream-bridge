version: '3.8'

services:
  streambridge:
    image: ywsj/stream-bridge:latest
    container_name: streambridge
    restart: unless-stopped
    ports:
      - "5300:5300"
    volumes:
      - ./data:/app/data
    environment:
      - ADMIN_USER=admin
      - ADMIN_PASS=admin123
      - SECRET_KEY=change...ng
      - MONITOR_INTERVAL=60
